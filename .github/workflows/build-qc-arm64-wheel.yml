name: Build qc-fix ARM64 wheel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64-wheel:
    runs-on: ubuntu-24.04-arm
    container:
      image: quay.io/pypa/manylinux_2_28_aarch64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build frontend
        run: |
          /opt/python/cp39-cp39/bin/python -m pip install maturin==1.9.4
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build manylinux ARM64 wheel
        run: >-
          /opt/python/cp39-cp39/bin/maturin build
          --release
          --interpreter /opt/python/cp39-cp39/bin/python
          --compatibility manylinux_2_28
          --out dist

      - name: Record checksums
        run: sha256sum dist/*.whl

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: vllm-router-qc-fix-arm64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
